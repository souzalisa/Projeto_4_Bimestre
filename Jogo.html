<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Saber Mais</title>
</head>
<body>
    <header>
        <h1>SABER MAIS</h1>
    </header>

    <h2>QUIZ DE CONHECIMENTOS GERAIS!</h2>
    <br><br>
    <p>Teste seu nível de conhecimento geral em diferentes níveis:</p>

    <div class="leftcolumn">
        <div class="card">
            <p id="nivel"> Nível 1 </p>
            <p id="dificuldade"> DIFICULDADE: </p>
            <p>FÁCIL</p>
            <button>
                <a href="#">Jogar</a>
            </button>
        </div>
        <div class="card">
            <p id="nivel"> Nível 2 </p>
            <p id="dificuldade"> DIFICULDADE: </p>
            <p>MÉDIO</p>
            <button>
                <a href="#">Jogar</a>
            </button>
        </div>
    </div>

    <div class="rightcolumn">
        <div class="card">
            <p id="nivel"> Nível 3 </p>
            <p id="dificuldade"> DIFICULDADE: </p>
            <p>DIFÍCIL</p>
            <button>
                <a href="#">Jogar</a>
            </button>
        </div>
    </div>

</body>
</html>
